name: Bootstrap source and first release

on:
  push:
    branches: [main]
    paths:
      - "kernel-source.zip.b64"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Expand initial source archive
        run: |
          base64 --decode kernel-source.zip.b64 > kernel-source.zip
          unzip -q -o kernel-source.zip -d .
          rm -f kernel-source.zip kernel-source.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish initial Kernel workspace"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, verify, and build
        run: |
          npm install
          npm run check
          npm test
          npm run build

      - name: Open first release pull request
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
